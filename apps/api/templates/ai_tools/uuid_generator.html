{% extends "public_base.html" %}
{% block title %}UUID Generator — {{ site_name }}{% endblock %}
{% block extra_head %}
<style>
.tool-shell { max-width:760px;margin:0 auto;padding:48px 20px }
.uuid-row { display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-family:monospace;font-size:14px;color:#cfe6ff }
.uuid-row button { margin-left:auto;flex-shrink:0 }
.ctrl-bar { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center }
</style>
{% endblock %}
{% block content %}
<div class="tool-shell">
  <div style="text-align:center;margin-bottom:32px">
    <a href="{{ url_for('ai.index') }}" style="font-size:12px;color:var(--c-text-3);text-decoration:none">← AI Tools Hub</a>
    <h1 style="font-size:38px;font-weight:900;font-family:'Space Grotesk',sans-serif;background:linear-gradient(135deg,var(--c-accent),var(--c-accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:12px 0 6px">UUID Generator</h1>
    <p style="color:var(--c-text-2)">Generate RFC-4122 v4 UUIDs instantly, entirely in your browser.</p>
  </div>

  <div class="ctrl-bar">
    <label style="font-size:13px;color:#9fb3d1">Count:</label>
    <input id="count" type="number" min="1" max="100" value="5" class="admin-input" style="width:80px">
    <label style="font-size:13px;color:#9fb3d1"><input type="checkbox" id="uppercase"> Uppercase</label>
    <label style="font-size:13px;color:#9fb3d1"><input type="checkbox" id="hyphens" checked> Hyphens</label>
    <button class="btn-neon" id="genBtn">Generate</button>
    <button class="btn-ghost-neon" id="copyAllBtn">Copy All</button>
  </div>

  <div id="output"></div>
</div>

<script>
function uuidv4() {
  return crypto.randomUUID ? crypto.randomUUID() :
    ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}
function render() {
  const count = Math.max(1, Math.min(100, parseInt(document.getElementById('count').value) || 1));
  const upper = document.getElementById('uppercase').checked;
  const hyphens = document.getElementById('hyphens').checked;
  const out = document.getElementById('output');
  out.innerHTML = '';
  for (let i = 0; i < count; i++) {
    let id = uuidv4();
    if (!hyphens) id = id.replace(/-/g, '');
    if (upper) id = id.toUpperCase();
    const row = document.createElement('div');
    row.className = 'uuid-row';
    row.innerHTML = `<span class="uuid-text">${id}</span><button class="btn-ghost-neon" style="padding:4px 10px;font-size:11px" onclick="navigator.clipboard.writeText('${id}')">Copy</button>`;
    out.appendChild(row);
  }
}
document.getElementById('genBtn').addEventListener('click', render);
document.getElementById('copyAllBtn').addEventListener('click', () => {
  const ids = [...document.querySelectorAll('.uuid-text')].map(e => e.textContent).join('\n');
  navigator.clipboard.writeText(ids);
});
render();
</script>
{% endblock %}
