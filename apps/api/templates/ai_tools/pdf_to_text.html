{% extends "public_base.html" %}
{% block title %}PDF to Text — {{ site_name }}{% endblock %}
{% block extra_head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
.tool-shell { max-width:820px;margin:0 auto;padding:48px 20px }
.drop-zone { border:2px dashed rgba(var(--c-accent-rgb),0.3);border-radius:16px;padding:40px;text-align:center;transition:all .2s;cursor:pointer;background:rgba(var(--c-accent-rgb),0.03) }
.drop-zone:hover,.drop-zone.drag-over { border-color:rgba(var(--c-accent-rgb),0.7);background:rgba(var(--c-accent-rgb),0.07) }
textarea.admin-input { width:100%;min-height:320px;font-family:monospace;font-size:13px;margin-top:18px }
.opt-row { display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap }
</style>
{% endblock %}
{% block content %}
<div class="tool-shell">
  <div style="text-align:center;margin-bottom:32px">
    <a href="{{ url_for('ai.index') }}" style="font-size:12px;color:var(--c-text-3);text-decoration:none">← AI Tools Hub</a>
    <h1 style="font-size:38px;font-weight:900;font-family:'Space Grotesk',sans-serif;background:linear-gradient(135deg,var(--c-accent),var(--c-accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:12px 0 6px">PDF to Text</h1>
    <p style="color:var(--c-text-2)">Extract text content from any PDF — entirely in your browser, no upload.</p>
  </div>

  <div class="drop-zone" id="dropZone">
    <p style="color:#9fb3d1;margin-bottom:8px" id="dropLabel">Drag a PDF file here, or</p>
    <button class="btn-ghost-neon" type="button" onclick="document.getElementById('fileInput').click()">Choose File</button>
    <input type="file" id="fileInput" accept="application/pdf" style="display:none">
  </div>

  <p id="status" style="text-align:center;color:var(--c-text-2);font-size:13px;margin-top:14px"></p>
  <textarea id="output" class="admin-input" readonly placeholder="Extracted text will appear here…"></textarea>
  <div class="opt-row">
    <button class="btn-ghost-neon" id="copyBtn">Copy Text</button>
    <button class="btn-ghost-neon" id="downloadBtn">Download .txt</button>
  </div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const status = document.getElementById('status');
const output = document.getElementById('output');

async function extract(file) {
  status.textContent = 'Extracting…';
  document.getElementById('dropLabel').textContent = file.name;
  try {
    const bytes = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n\n--- Page ' + i + ' ---\n\n';
      status.textContent = `Extracting page ${i} of ${pdf.numPages}…`;
    }
    output.value = text.trim();
    status.textContent = `Extracted ${pdf.numPages} page(s).`;
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) extract(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) extract(e.target.files[0]); });
document.getElementById('copyBtn').addEventListener('click', () => navigator.clipboard.writeText(output.value));
document.getElementById('downloadBtn').addEventListener('click', () => {
  const blob = new Blob([output.value], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'extracted.txt'; a.click();
  URL.revokeObjectURL(url);
});
</script>
{% endblock %}
