<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ link.title }} — Protected</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -40%; left: -20%;
    width: 60%; height: 80%;
    background: radial-gradient(ellipse, rgba(29,185,84,0.15), transparent 70%);
    pointer-events: none;
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    backdrop-filter: blur(20px);
  }
  .lock-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(29,185,84,0.12); color: #1DB954;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 26px;
  }
  h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
  p.sub { color: #a3a3a3; font-size: 0.9rem; margin-bottom: 26px; }
  input[type="password"] {
    width: 100%; padding: 13px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 0.95rem; margin-bottom: 14px; outline: none;
  }
  input[type="password"]:focus { border-color: #1DB954; }
  button {
    width: 100%; padding: 13px 16px; border-radius: 12px; border: none;
    background: #1DB954; color: #08110c; font-weight: 700; font-size: 0.95rem;
    cursor: pointer; transition: opacity .15s ease;
  }
  button:hover { opacity: 0.9; }
  .error { color: #ef4444; font-size: 0.85rem; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">&#128274;</div>
    <h1>{{ link.title }}</h1>
    <p class="sub">This payment link is password protected.</p>
    {% if error %}<p class="error">Incorrect password — try again.</p>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input type="password" name="password" placeholder="Enter password" autofocus required>
      <button type="submit">Unlock</button>
    </form>
  </div>
</body>
</html>
