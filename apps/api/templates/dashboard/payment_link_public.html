<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ link.title }} — Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -40%; left: -20%;
    width: 60%; height: 80%;
    background: radial-gradient(ellipse, rgba(29,185,84,0.15), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -40%; right: -20%;
    width: 60%; height: 80%;
    background: radial-gradient(ellipse, rgba(139,92,246,0.12), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .card {
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    padding: 48px 40px;
    text-align: center;
  }
  .icon-wrap {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1DB954, #0ea647);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 8px 30px rgba(29,185,84,0.3);
  }
  .icon-wrap svg { width: 32px; height: 32px; color: #fff; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .desc {
    color: #b3b3b3;
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .amount-display {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 32px;
  }
  .amount-currency {
    font-size: 0.85rem;
    color: #b3b3b3;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .amount-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 3rem;
    font-weight: 700;
    background: linear-gradient(135deg, #1DB954, #F2C94C);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .pay-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #1DB954, #0ea647);
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Plus Jakarta Sans', sans-serif;
    letter-spacing: 0.01em;
  }
  .pay-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(29,185,84,0.4);
  }
  .secure-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    font-size: 0.8rem;
    color: #666;
  }
  .secure-note svg { width: 14px; height: 14px; }
  .powered-by {
    margin-top: 24px;
    font-size: 0.75rem;
    color: #444;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">
    <i data-lucide="credit-card"></i>
  </div>
  <h1>{{ link.title }}</h1>
  {% if link.description %}
  <p class="desc">{{ link.description }}</p>
  {% endif %}

  <div class="amount-display">
    <div class="amount-currency">{{ link.currency or 'USD' }}</div>
    <div class="amount-value">{{ "%.2f"|format(link.amount|float) }}</div>
  </div>

  <a href="/marketplace" class="pay-btn">
    <i data-lucide="lock" style="display:inline; width:18px; height:18px; vertical-align:middle; margin-right:6px;"></i>
    Pay Now
  </a>

  <div class="secure-note">
    <i data-lucide="shield-check"></i>
    <span>Secure payment • 256-bit SSL encryption</span>
  </div>

  <div class="powered-by">
    Powered by {{ get_setting('site_name') or 'Bazillin Studio' }}
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
