<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ page_title or "Checkout" }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', -apple-system, sans-serif; background:#0a0a0a; }
  h1, h2, h3 { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
  .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen text-white">
  {% block content %}{% endblock %}

  <footer class="py-6 text-center">
    <span class="text-xs text-gray-600">Powered by {{ platform_name or "Bazillin Studio" }}</span>
  </footer>
</body>
</html>
