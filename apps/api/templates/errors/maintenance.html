{% extends "base.html" %}
{% block title %}Maintenance — {{ site_name }}{% endblock %}
{% block body %}
<div class="min-h-screen grid-pattern flex items-center justify-center px-4">
  <div class="text-center max-w-lg">
    <div class="text-8xl mb-6 animate-float">🔧</div>
    <h1 class="text-4xl font-bold font-display gradient-text mb-4">Under Maintenance</h1>
    <p class="text-gray-400 mb-8 leading-relaxed">We're performing scheduled maintenance to improve your experience. We'll be back shortly.</p>
    <div class="glass border border-cyan-500/20 rounded-2xl px-6 py-4 inline-block">
      <p class="text-cyan-400 text-sm font-mono">Status: Maintenance Mode Active</p>
    </div>
  </div>
</div>
{% endblock %}
