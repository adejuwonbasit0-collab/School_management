{% extends "base.html" %}
{% block title %}Set Your Password — {{ site_name }}{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-orb" style="width:320px;height:320px;top:-80px;left:-100px;background:radial-gradient(circle,#1DB954,transparent 70%)"></div>
  <div class="auth-orb" style="width:280px;height:280px;bottom:-100px;right:-80px;background:radial-gradient(circle,#F2C94C,transparent 70%)"></div>
  <div class="auth-card reveal">
    <div class="text-center mb-8">
      <a href="{{ url_for('cms.home') }}" class="text-2xl font-bold font-display gradient-text">{{ site_name }}</a>
      <p class="mt-2 text-gray-400 text-sm">We started an account for you when you sent your project request — set a password to log in any time</p>
    </div>
    <div class="glass-card-premium p-8">
      <form method="POST" action="{{ url_for('auth.set_password', token=token) }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">New Password</label>
          <input name="password" type="password" required minlength="8" autofocus class="input-premium" placeholder="At least 8 characters"/>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Confirm Password</label>
          <input name="confirm_password" type="password" required minlength="8" class="input-premium" placeholder="Type it again"/>
        </div>
        <button type="submit" class="btn-neon w-full justify-center py-3">Set Password & Log In</button>
      </form>
      <p class="text-center text-xs text-gray-500 mt-5">
        <a href="{{ url_for('auth.login') }}" class="hover:text-gray-300">← Back to login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
