{% extends "base.html" %}
{% block title %}Create Account — {{ site_name }}{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-orb" style="width:320px;height:320px;top:-80px;right:-100px;background:radial-gradient(circle,var(--c-accent),transparent 70%)"></div>
  <div class="auth-orb" style="width:280px;height:280px;bottom:-100px;left:-80px;background:radial-gradient(circle,var(--c-accent-2),transparent 70%)"></div>
  <div class="auth-card reveal">
    <div class="text-center mb-8">
      <a href="{{ url_for('cms.home') }}" class="text-2xl font-bold font-display gradient-text">{{ site_name }}</a>
      <p class="mt-2 text-gray-400 text-sm">Create your free account</p>
    </div>
    <div class="glass-card-premium p-8">
      <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Full Name</label>
          <input name="name" type="text" autocomplete="name"
            class="input-premium"
            placeholder="Your name"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
          <input name="email" type="email" required autocomplete="email"
            class="input-premium"
            placeholder="you@example.com"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
          <input name="password" type="password" required minlength="6"
            class="input-premium"
            placeholder="Min 6 characters"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Confirm Password</label>
          <input name="confirm_password" type="password" required
            class="input-premium"
            placeholder="Repeat password"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Account Type</label>
          <select name="role" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500/50 transition-all">
            <option value="user">User — Buy products & use tools</option>
            <option value="freelancer">Freelancer — Offer services & apply to jobs</option>
            <option value="client">Client — Post jobs & hire talent</option>
          </select>
        </div>
        <button type="submit" class="w-full btn-neon justify-center py-3 text-sm font-semibold mt-2">Create Account</button>
      </form>
      <p class="mt-6 text-center text-sm text-gray-400">
        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-cyan-400 hover:text-cyan-300 font-medium">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
