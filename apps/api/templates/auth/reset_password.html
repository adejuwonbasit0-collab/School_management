{% extends "base.html" %}
{% block title %}Set New Password — {{ site_name }}{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-orb" style="width:320px;height:320px;top:-80px;left:-100px;background:radial-gradient(circle,var(--c-accent),transparent 70%)"></div>
  <div class="auth-orb" style="width:280px;height:280px;bottom:-100px;right:-80px;background:radial-gradient(circle,var(--c-accent-2),transparent 70%)"></div>
  <div class="auth-card reveal">
    <div class="text-center mb-8">
      <a href="{{ url_for('cms.home') }}" class="text-2xl font-bold font-display gradient-text">{{ site_name }}</a>
      <p class="mt-2 text-gray-400 text-sm">Choose a new password</p>
    </div>
    <div class="glass-card-premium p-8">
      <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">New Password</label>
          <input name="password" type="password" required autocomplete="new-password" autofocus
            class="input-premium" placeholder="At least 8 characters"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Confirm New Password</label>
          <input name="confirm_password" type="password" required autocomplete="new-password"
            class="input-premium" placeholder="••••••••"/>
        </div>
        <button type="submit" class="w-full btn-neon justify-center py-3 text-sm font-semibold">Set New Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
