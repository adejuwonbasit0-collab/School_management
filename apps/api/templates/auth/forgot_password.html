{% extends "base.html" %}
{% block title %}Reset Password — {{ site_name }}{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-orb" style="width:320px;height:320px;top:-80px;left:-100px;background:radial-gradient(circle,var(--c-accent),transparent 70%)"></div>
  <div class="auth-orb" style="width:280px;height:280px;bottom:-100px;right:-80px;background:radial-gradient(circle,var(--c-accent-2),transparent 70%)"></div>
  <div class="auth-card reveal">
    <div class="text-center mb-8">
      <a href="{{ url_for('cms.home') }}" class="text-2xl font-bold font-display gradient-text">{{ site_name }}</a>
      <p class="mt-2 text-gray-400 text-sm">Reset your password</p>
    </div>
    <div class="glass-card-premium p-8">
      <p class="text-sm text-gray-400 mb-5">Enter the email on your account and we'll send you a link to set a new password.</p>
      <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
          <input name="email" type="email" required autocomplete="email"
            class="input-premium" placeholder="you@example.com"/>
        </div>
        <button type="submit" class="w-full btn-neon justify-center py-3 text-sm font-semibold">Send Reset Link</button>
      </form>
      <p class="mt-6 text-center text-sm text-gray-400">
        Remembered it? <a href="{{ url_for('auth.login') }}" class="text-cyan-400 hover:text-cyan-300 font-medium">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
