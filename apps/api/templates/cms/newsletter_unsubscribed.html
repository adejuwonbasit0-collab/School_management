{% extends "public_base.html" %}
{% block title %}Unsubscribed — {{ site_name }}{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
  <div class="text-center max-w-md">
    <p class="text-5xl mb-4">✓</p>
    <h1 class="text-2xl font-bold text-white mb-2">You're unsubscribed</h1>
    <p class="text-gray-400 text-sm">{{ email }} won't receive any more newsletter emails from us. You can re-subscribe any time from the site footer.</p>
    <a href="{{ url_for('cms.home') }}" class="btn-ghost-neon mt-8 inline-block">← Back to Home</a>
  </div>
</div>
{% endblock %}
