<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ agent.name }}</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:transparent; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #widget { display:flex; flex-direction:column; height:100%; background:#12151c; color:#e6e6e6; }
  #header { display:flex; align-items:center; gap:8px; padding:14px 16px; background:#181c26; border-bottom:1px solid #262b38; }
  #header .avatar { font-size:22px; }
  #header .name { font-weight:600; font-size:14px; }
  #header .role { font-size:11px; color:#8b93a5; }
  #messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .msg-assistant { background:#232838; align-self:flex-start; border-bottom-left-radius:4px; }
  .msg-user { background:#2563eb; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  #error { font-size:12px; color:#f87171; padding:0 14px; min-height:16px; }
  #inputRow { display:flex; gap:8px; padding:12px; border-top:1px solid #262b38; }
  #inputRow input { flex:1; background:#1c202b; border:1px solid #2c3242; border-radius:20px; padding:9px 14px; color:#fff; font-size:13.5px; outline:none; }
  #inputRow button { background:#2563eb; border:none; border-radius:20px; padding:9px 16px; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  #inputRow button:disabled { opacity:0.5; cursor:default; }
  #poweredBy { text-align:center; font-size:10px; color:#565d70; padding-bottom:8px; }
</style>
</head>
<body>
<div id="widget">
  <div id="header">
    <span class="avatar">{{ agent.avatar_emoji }}</span>
    <div>
      <div class="name">{{ agent.name }}</div>
      {% if agent.role %}<div class="role">{{ agent.role }}</div>{% endif %}
    </div>
  </div>
  <div id="messages">
    <div class="msg msg-assistant">{{ agent.public_greeting or ("Hi, I'm " ~ agent.name ~ ". How can I help?") }}</div>
  </div>
  <div id="error"></div>
  <div id="inputRow">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off"/>
    <button id="sendBtn" onclick="sendMsg()">Send</button>
  </div>
  <div id="poweredBy">Powered by {{ get_setting('site_name', 'Bazillin Studio') }}</div>
</div>
<script>
const SEND_URL = {{ url_for('cms.agent_embed_send', agent_id=agent.id) | tojson }};
let history = [];
const messagesEl = document.getElementById('messages');
const errorEl = document.getElementById('error');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });

function escapeHtml(s) { return s.replace(/</g, '&lt;'); }

async function sendMsg() {
  const message = inputEl.value.trim();
  if (!message) return;
  messagesEl.insertAdjacentHTML('beforeend', `<div class="msg msg-user">${escapeHtml(message)}</div>`);
  inputEl.value = '';
  errorEl.textContent = '';
  sendBtn.disabled = true;
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch(SEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history })
    });
    const d = await res.json();
    if (d.error) {
      errorEl.textContent = d.error;
    } else {
      history.push({ role: 'user', content: message });
      history.push({ role: 'assistant', content: d.response });
      history = history.slice(-12);
      messagesEl.insertAdjacentHTML('beforeend', `<div class="msg msg-assistant">${escapeHtml(d.response)}</div>`);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  } catch (e) {
    errorEl.textContent = 'Network error — please try again.';
  }
  sendBtn.disabled = false;
}
</script>
</body>
</html>
