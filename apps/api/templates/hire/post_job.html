{% extends "dashboard/base_dashboard.html" %}
{% block title %}Post a Job — {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
  <h1 class="text-2xl font-bold font-display gradient-text mb-8">Post a Job</h1>
  <div class="glass border border-white/10 rounded-2xl p-8">
    <form method="POST" action="{{ url_for('freelance.post_job') }}" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div><label class="admin-label">Job Title *</label><input name="title" required class="admin-input w-full mt-1" placeholder="e.g. Build a SaaS dashboard with Next.js"/></div>
      <div><label class="admin-label">Category</label>
        <select name="category" class="admin-input w-full mt-1">
          {% for c in ['Web Development','Mobile App','UI/UX Design','AI/ML','DevOps','Content Writing','SEO','Other'] %}<option>{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div><label class="admin-label">Description *</label><textarea name="description" rows="5" required class="admin-input w-full mt-1 resize-none" placeholder="Describe the project scope, requirements, and deliverables…"></textarea></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="admin-label">Budget Min ($)</label><input name="budget_min" type="number" class="admin-input w-full mt-1" placeholder="500"/></div>
        <div><label class="admin-label">Budget Max ($)</label><input name="budget_max" type="number" class="admin-input w-full mt-1" placeholder="2000"/></div>
      </div>
      <div><label class="admin-label">Required Skills (comma separated)</label><input name="skills" class="admin-input w-full mt-1" placeholder="React, Python, PostgreSQL"/></div>
      <div><label class="admin-label">Project Duration</label>
        <select name="duration" class="admin-input w-full mt-1">
          <option>Less than 1 week</option><option>1-4 weeks</option><option>1-3 months</option><option>3-6 months</option><option>Ongoing</option>
        </select>
      </div>
      <div class="flex gap-3 pt-2">
        <a href="{{ url_for('dashboard.home') }}" class="btn-ghost-neon text-sm py-2.5">Cancel</a>
        <button type="submit" class="btn-neon py-2.5 px-6">Post Job</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
